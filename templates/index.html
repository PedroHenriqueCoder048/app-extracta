{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Extracta</title>
</head>
<body>
    <header>
      <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
          <span class="navbar-brand mb-0 h1">Extracta</span>
        </div>
      </nav>
    </header>
    <main>
        <div class="mb-3 m-3">
            {% if method == 'GET' %}
                <div class="alert alert-primary" role="alert">
                    Selecione o arquivo!
                </div>
            {% elif method == 'POST' and not file %}
                <div class="alert alert-danger" role="alert">
                    Arquivo não selecionado!
                </div>
            {% elif method == 'POST' and file%}
                <div class="alert alert-success" role="alert">
                    Upload de arquivo feito com sucesso!
                    {{file}}
                </div>
            {% endif %}
        </div>
        <form class="form-control mb-3" action="" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label for="exampleFormControlTextarea1" class="form-label">Dados extraidos</label>
                <textarea class="form-control" id="textArea" rows="12">
                    {{response|safe}}
                </textarea>
            </div>
            <div class="mb-3">
                <label for="formFile" class="form-label">Seleciona Arquivo</label>
                <input class="form-control" type="file" id="formFile" name="formFile" accept=".pdf">
            </div>
            <div class="mb-3">
                <select class="form-select" name="formatData" aria-label="Selecionar tipo">
                    <option value="Texto">Texto</option>
                    <option value="SQL">SQL</option>
                    <option value="JSON">JSON</option>
                    <option value="HTML">HTML</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Extrair</button>
            <button id="buttonClean" class="btn btn-success" onclick="cleanTextArea()">Limpar</button>
        </form>
    </main>
    <footer>

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="{% static 'js/index.js' %}"></script> 
</body>
</html>
